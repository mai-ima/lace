<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TENRYU RACING 3D 自由走行（試作）</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  .w3-hud{position:fixed;left:12px;top:10px;color:#fff;font-size:14px;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.5}
  .w3-hud b{font-size:30px}
</style>
<script type="importmap">{ "imports": { "three": "./assets/vendor/three/three.module.js", "three/addons/": "./assets/vendor/three/addons/" } }</script>
</head><body>
<div id="stage"></div>
<script src="assets/js/core.js"></script>
<script src="assets/js/gui.js"></script>
<script src="assets/js/race-data.js"></script>
<script src="assets/js/race-spec.js"></script>
<script src="assets/js/race-audio.js"></script>
<script src="assets/vendor/race-tex.js"></script>
<script type="module">
import { start } from './assets/js/w3/app.js';
const q = new URLSearchParams(location.search);
window.W3 = await start(document.getElementById('stage'), { capture: q.has('capture'), tier: q.get('tier') || null, start: q.has('x') ? { x: +q.get('x'), z: +q.get('z') } : null, onExit: () => { location.href = 'index.html'; } });
document.title = document.title + ' ready';
</script>
